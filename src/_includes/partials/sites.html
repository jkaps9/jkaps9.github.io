<section
  class="projects"
  id="projects"
>
  <div class="container">
    <ul class="projects__list">
      {% for repo in repos %}
        {% if repo.private === false %}
          <li>
            <a
              href="{{ repo.html_url }}"
              target="_blank"
            >
              {{ repo.name }}
            </a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</section>
