<section
  class="projects"
  id="projects"
>
  <div class="container">
    <h1>My Projects</h1>
    <ul class="projects__list">
      {% for repo in collections.sortedRepos %}
        <li>
          <a
            href="https://jkaps9.github.io/{{ repo.name }}"
            target="_blank"
          >
            {{ repo.name }}
          </a>
          <p>Last Updated: {{ repo.created_at | readableDate }}</p>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
