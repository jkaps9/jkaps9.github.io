<section class="my-sites">
  <div class="container">
    <ul>
      {% for repo in repos %}
        {% if repo.private === false %}
          <li>
            <a
              href="https://jkaps9.github.io/{{ repo.name }}"

          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</section>
