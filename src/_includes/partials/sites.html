<section
  class="projects"
  id="projects"
>
  <div class="container">
    <h1>My Projects</h1>
    <ul class="projects__list">
      {% for repo in repos %}
        {% if repo.has_pages === true %}
          <li>
            <a
              href="https://jkaps9.github.io/{{ repo.name }}"
              target="_blank"
            >
              {{ repo.name }}
            </a>
          </li>
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</section>
